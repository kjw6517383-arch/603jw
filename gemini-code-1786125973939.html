<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>실시간 금 시세 대시보드</title>

    <style>
        /* 기본 스타일 Reset 및 폰트 설정 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0f172a; /* 고급스러운 다크 네이비 테마 */
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 대시보드 메인 카드 컨테이너 */
        .card-container {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(234, 179, 8, 0.1);
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fef08a; /* Soft Yellow */
            margin-bottom: 6px;
        }

        .update-time {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 24px;
        }

        /* 가격 표시 메인 섹션 */
        .price-section {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px 16px;
            margin-bottom: 24px;
        }

        .price-label {
            font-size: 0.9rem;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        .price-value {
            font-size: 2.75rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -1px;
            margin-bottom: 12px;
        }

        .price-value span {
            font-size: 1.25rem;
            font-weight: 500;
            color: #e2e8f0;
        }

        /* 변동폭 태그 */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .badge.up {
            background-color: rgba(239, 68, 68, 0.15);
            color: #f87171; /* 상승: 빨간색 */
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .badge.down {
            background-color: rgba(59, 130, 246, 0.15);
            color: #60a5fa; /* 하락: 파란색 */
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .refresh-btn {
            background: linear-gradient(135deg, #eab308, #ca8a04);
            color: #0f172a;
            border: none;
            width: 100%;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .refresh-btn:hover {
            opacity: 0.9;
        }

        .status-msg {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- 헤더 섹션 -->
        <div class="header">
            <h1>🪙 실시간 순금 시세 (1g)</h1>
            <div class="update-time" id="update-time">최신 정보를 불러오는 중...</div>
        </div>

        <!-- 가격 표시 섹션 -->
        <div class="price-section">
            <div class="price-label">국내 순금 시세</div>
            <div class="price-value" id="gold-price">--- <span>원</span></div>
            <div class="badge up" id="price-diff">
                <span>-</span>
            </div>
        </div>

        <!-- 푸터 및 새로고침 버튼 -->
        <div class="footer">
            <button class="refresh-btn" onclick="fetchGoldPrice()">
                🔄 시세 즉시 갱신
            </button>
            <div class="status-msg" id="status-msg">
                10초마다 자동으로 시세가 갱신됩니다.
            </div>
        </div>
    </div>

    <script>
        // 네이버 금융 금시세 크롤링 함수 (JavaScript 기반)
        async function fetchGoldPrice() {
            const timeEl = document.getElementById('update-time');
            const priceEl = document.getElementById('gold-price');
            const diffEl = document.getElementById('price-diff');
            const statusEl = document.getElementById('status-msg');

            statusEl.innerText = '최신 데이터를 불러오는 중...';

            try {
                // CORS 제한 회피를 위한 AllOrigins 프록시 사용
                const targetUrl = encodeURIComponent("https://finance.naver.com/marketindex/goldDetail.naver?code=CMDT_GD");
                const response = await fetch(`https://api.allorigins.win/get?url=${targetUrl}`);
                
                if (!response.ok) throw new Error('네트워크 응답 오류');

                const data = await response.json();
                
                // HTML 파싱
                const parser = new DOMParser();
                const doc = parser.parseFromString(data.contents, 'text/html');

                // 네이버 데이터 추출
                const priceText = doc.querySelector('p.no_today span.blind')?.innerText || 'N/A';
                const diffText = doc.querySelector('p.no_exday span.blind')?.innerText || '0';
                const icoType = doc.querySelector('p.no_exday span.ico')?.innerText || '';

                const now = new Date();
                const timeString = now.toLocaleTimeString('ko-KR', { hour12: false });

                // UI 적용
                priceEl.innerHTML = `${priceText} <span>원</span>`;
                timeEl.innerText = `최종 갱신: ${timeString}`;

                if (icoType.includes('상승') || icoType.includes('상한')) {
                    diffEl.className = 'badge up';
                    diffEl.innerHTML = `▲ 전일 대비 ${diffText}원`;
                } else if (icoType.includes('하락') || icoType.includes('하한')) {
                    diffEl.className = 'badge down';
                    diffEl.innerHTML = `▼ 전일 대비 ${diffText}원`;
                } else {
                    diffEl.className = 'badge';
                    diffEl.innerHTML = `- 전일 대비 ${diffText}원`;
                }

                statusEl.innerText = '10초마다 자동으로 시세가 갱신됩니다.';

            } catch (error) {
                console.error('크롤링 실패:', error);
                statusEl.innerText = '데이터를 불러오는 중 오류가 발생했습니다.';
            }
        }

        // 초기 실행 및 10초 주기 반복
        fetchGoldPrice();
        setInterval(fetchGoldPrice, 10000);
    </script>
</body>
</html>
