<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 귀금속 시세 대시보드</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card-container {
            background: linear-gradient(160deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 24px;
            padding: 36px 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 25px rgba(212, 175, 55, 0.15);
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.45rem;
            font-weight: 700;
            color: #fef08a;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 4px;
        }

        .update-time {
            font-size: 0.8rem;
            color: #cbd5e1;
            margin-top: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 12px;
            border-radius: 12px;
            display: inline-block;
        }

        .tab-container {
            display: flex;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            gap: 2px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 0;
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #eab308, #ca8a04);
            color: #0f172a;
            box-shadow: 0 2px 8px rgba(234, 179, 8, 0.3);
        }

        .tab-btn.silver-active {
            background: linear-gradient(135deg, #e2e8f0, #94a3b8);
            color: #0f172a;
            box-shadow: 0 2px 8px rgba(226, 232, 240, 0.3);
        }

        .price-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
        }

        .price-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .price-card:hover {
            border-color: rgba(212, 175, 55, 0.4);
            background: rgba(255, 255, 255, 0.05);
        }

        .price-type .label {
            font-size: 0.85rem;
            color: #94a3b8;
            display: block;
            margin-bottom: 4px;
        }

        .price-type .title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
        }

        .price-info {
            text-align: right;
        }

        .price-amount {
            font-size: 1.5rem;
            font-weight: 800;
            color: #fbbf24;
            letter-spacing: -0.5px;
        }

        .price-unit {
            font-size: 0.9rem;
            font-weight: 500;
            color: #cbd5e1;
        }

        .badge {
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 4px;
            display: inline-block;
        }

        .badge.up { color: #f87171; }
        .badge.down { color: #60a5fa; }

        .footer {
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: center;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #eab308, #ca8a04);
            color: #0f172a;
            border: none;
            width: 100%;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(234, 179, 8, 0.25);
            transition: all 0.2s ease;
        }

        .refresh-btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .status-msg {
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="header">
            <h1 id="main-title">🏆 실시간 귀금속 시세</h1>
            <div class="subtitle" id="gold-subtitle">순금 24K (3.75g / 1돈 기준)</div>
            <div class="update-time" id="update-time">시세 조회 대기 중...</div>
        </div>

        <div class="tab-container">
            <button class="tab-btn active" onclick="switchTab('24k')">순금 24K</button>
            <button class="tab-btn" onclick="switchTab('18k')">18K</button>
            <button class="tab-btn" onclick="switchTab('14k')">14K</button>
            <button class="tab-btn" onclick="switchTab('silver')">🥈 은 시세</button>
        </div>

        <div class="price-grid">
            <div class="price-card">
                <div class="price-type">
                    <span class="label">국제 기준 시세</span>
                    <span class="title">🛒 내가 살 때 (예상)</span>
                </div>
                <div class="price-info">
                    <div class="price-amount" id="buy-price">--- <span class="price-unit">원</span></div>
                    <div class="badge up">▲ 실시간 API</div>
                </div>
            </div>

            <div class="price-card">
                <div class="price-type">
                    <span class="label">국제 기준 시세</span>
                    <span class="title">💰 내가 팔 때 (예상)</span>
                </div>
                <div class="price-info">
                    <div class="price-amount" id="sell-price" style="color: #60a5fa;">--- <span class="price-unit">원</span></div>
                    <div class="badge down">▼ 실시간 API</div>
                </div>
            </div>
        </div>

        <div class="footer">
            <button class="refresh-btn" onclick="fetchMetalPrices()">
                🔄 시세 즉시 갱신
            </button>
            <div class="status-msg" id="status-msg">
                GoldAPI.io 오픈 API를 통해 실시간 원화(KRW) 시세를 불러옵니다.
            </div>
        </div>
    </div>

    <script>
        // ⚠️ 여기에 발급받으신 GoldAPI.io 키를 넣어주세요.
        const API_KEY = "goldapi-demo-key"; 

        let raw24kBasePrice = 0; // 1돈(3.75g) 당 24K 원화 가격
        let rawSilverBasePrice = 0; // 1돈(3.75g) 당 은 원화 가격
        let currentTab = '24k';

        // 탭 전환
        function switchTab(type) {
            currentTab = type;
            
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(btn => btn.classList.remove('active', 'silver-active'));

            const titleEl = document.getElementById('main-title');
            const subtitleEl = document.getElementById('gold-subtitle');

            if (type === '24k') {
                tabs[0].classList.add('active');
                titleEl.innerHTML = "🏆 실시간 귀금속 시세";
                subtitleEl.innerText = "순금 24K (3.75g / 1돈 기준)";
            } else if (type === '18k') {
                tabs[1].classList.add('active');
                titleEl.innerHTML = "🏆 실시간 귀금속 시세";
                subtitleEl.innerText = "18K 금 시세 (순금 24K × 0.75 기준)";
            } else if (type === '14k') {
                tabs[2].classList.add('active');
                titleEl.innerHTML = "🏆 실시간 귀금속 시세";
                subtitleEl.innerText = "14K 금 시세 (순금 24K × 0.585 기준)";
            } else if (type === 'silver') {
                tabs[3].classList.add('silver-active');
                titleEl.innerHTML = "🥈 실시간 은(Silver) 시세";
                subtitleEl.innerText = "순은 99.9% (3.75g / 1돈 기준)";
            }

            renderPrices();
        }

        // 가격 계산 및 화면 출력
        function renderPrices() {
            const buyPriceEl = document.getElementById('buy-price');
            const sellPriceEl = document.getElementById('sell-price');

            let finalBuy = 0;
            let finalSell = 0;

            if (currentTab === 'silver') {
                buyPriceEl.style.color = '#e2e8f0';
                if (rawSilverBasePrice === 0) return;
                
                // 은: 살 때(소비자 수수료 약 +7% 감안), 팔 때(약 -7% 감안)
                finalBuy = Math.round(rawSilverBasePrice * 1.07);
                finalSell = Math.round(rawSilverBasePrice * 0.93);
            } else {
                buyPriceEl.style.color = '#fbbf24';
                if (raw24kBasePrice === 0) return;

                let base = raw24kBasePrice;
                if (currentTab === '18k') base = raw24kBasePrice * 0.75;
                if (currentTab === '14k') base = raw24kBasePrice * 0.585;

                // 금: 살 때(세금/세공 수수료 약 +5%), 팔 때(매입 수수료 약 -3%)
                finalBuy = Math.round(base * 1.05);
                finalSell = Math.round(base * 0.97);
            }

            buyPriceEl.innerHTML = `${finalBuy ? finalBuy.toLocaleString() : '---'} <span class="price-unit">원</span>`;
            sellPriceEl.innerHTML = `${finalSell ? finalSell.toLocaleString() : '---'} <span class="price-unit">원</span>`;
        }

        // Open API 호출 함수
        async function fetchMetalPrices() {
            const timeEl = document.getElementById('update-time');
            const statusEl = document.getElementById('status-msg');

            statusEl.innerText = '실시간 API 데이터 수집 중...';

            const myHeaders = new Headers();
            myHeaders.append("x-access-token", API_KEY);
            myHeaders.append("Content-Type", "application/json");

            const requestOptions = {
                method: 'GET',
                headers: myHeaders,
                redirect: 'follow'
            };

            try {
                // 1. 금(XAU) API 호출 (KRW 원화 기준)
                const goldRes = await fetch("https://www.goldapi.io/api/XAU/KRW", requestOptions);
                const goldData = await goldRes.json();

                // 2. 은(XAG) API 호출 (KRW 원화 기준)
                const silverRes = await fetch("https://www.goldapi.io/api/XAG/KRW", requestOptions);
                const silverData = await silverRes.json();

                if (goldData.price && silverData.price) {
                    // API는 Gram(g)당 가격을 주므로, 1돈(3.75g)으로 환산
                    raw24kBasePrice = goldData.price * 3.75;
                    rawSilverBasePrice = silverData.price * 3.75;

                    const now = new Date();
                    timeEl.innerText = `최종 갱신: ${now.toLocaleTimeString('ko-KR', { hour12: false })}`;
                    statusEl.innerText = 'GoldAPI.io를 통해 성공적으로 시세를 조회했습니다.';

                    renderPrices();
                } else {
                    throw new Error('API 키 미입력 또는 호출한도 초과');
                }

            } catch (error) {
                console.error(error);
                statusEl.innerText = 'API 키를 확인하거나 최신 키로 변경해 주세요.';
            }
        }

        // 실행
        fetchMetalPrices();
    </script>
</body>
</html>
